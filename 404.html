<!doctype html>
<html lang="en" data-theme="dark" data-accent="cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · not found</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    try { var t = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  </script>
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: left; padding: 24px; }
    .nf-box { max-width: 520px; }
    .nf code { font: 400 12px var(--font-mono); color: var(--acc-line); }
    .nf h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 500; letter-spacing: -.04em; line-height: 1; margin: 18px 0 14px; }
    .nf p { color: var(--text-2); margin-bottom: 28px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-box">
      <code>error 404 · goal state unreachable</code>
      <h1>No trajectory found.</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="chip primary" href="/">return home <span class="arr">↵</span></a>
    </div>
  </main>
</body>
</html>
